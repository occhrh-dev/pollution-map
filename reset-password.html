<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตั้งรหัสผ่านใหม่ — แผนที่ควบคุมมลพิษ</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#eef4f6;color:#173347;font-family:Sarabun,sans-serif}.card{width:min(440px,100%);padding:32px;border-radius:17px;background:#fff;box-shadow:0 18px 45px rgba(22,50,74,.16)}h1{margin:0 0 18px;font-size:24px}label{display:block;margin:12px 0 5px;font-weight:600}input{width:100%;padding:11px;border:1px solid #adc0ca;border-radius:8px;font:inherit}button{width:100%;margin-top:17px;padding:11px;border:0;border-radius:8px;color:white;background:#0e7c7b;font:inherit;font-weight:700}.message{margin-top:12px;font-size:14px}.error{color:#b42318}.ok{color:#08745e}</style></head>
<body><main class="card"><h1>ตั้งรหัสผ่านใหม่</h1><form id="form"><label for="password">รหัสผ่านใหม่</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirmPassword">ยืนยันรหัสผ่านใหม่</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required><button id="saveButton" type="submit">บันทึกรหัสผ่านใหม่</button></form><div id="message" class="message" role="status"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const config=window.POLLUTION_MAP_CONFIG||{};const message=document.getElementById('message');const ready=/^https:\/\/.+\.supabase\.co$/i.test(config.supabaseUrl||'')&&!!config.supabasePublishableKey;const client=ready?supabase.createClient(config.supabaseUrl,config.supabasePublishableKey):null;function show(text,error=false){message.textContent=text;message.className='message '+(error?'error':'ok');}if(!ready){document.querySelectorAll('input,button').forEach(el=>el.disabled=true);show('ระบบบัญชียังไม่ได้เชื่อมต่อฐานข้อมูล',true);}document.getElementById('form').addEventListener('submit',async event=>{event.preventDefault();if(!client)return;const password=document.getElementById('password').value;if(password!==document.getElementById('confirmPassword').value){show('รหัสผ่านทั้งสองช่องไม่ตรงกัน',true);return;}document.getElementById('saveButton').disabled=true;const {error}=await client.auth.updateUser({password});document.getElementById('saveButton').disabled=false;if(error){show('เปลี่ยนรหัสผ่านไม่สำเร็จ ลิงก์อาจหมดอายุ กรุณาขอลิงก์ใหม่',true);return;}show('เปลี่ยนรหัสผ่านสำเร็จ กำลังกลับไปหน้าเข้าสู่ระบบ');setTimeout(()=>location.replace('login.html'),1200);});
</script></body></html>
