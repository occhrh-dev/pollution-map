<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการสมาชิกหน่วยงาน</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#eef4f6;color:#173347;font-family:Sarabun,sans-serif}header{padding:20px 26px;color:#fff;background:#173347}main{width:min(820px,calc(100% - 28px));margin:24px auto;padding:24px;border-radius:15px;background:#fff;box-shadow:0 10px 30px rgba(22,50,74,.12)}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 180px auto;gap:8px;align-items:end}label{display:block;font-size:13px;font-weight:600}input,select,button{width:100%;margin-top:5px;padding:9px;border:1px solid #afc1ca;border-radius:8px;font:inherit}button{border:0;color:#fff;background:#0e7c7b;font-weight:700;cursor:pointer}.secondary{width:auto;color:#173347;background:#fff;border:1px solid #afc1ca}.danger{width:auto;background:#d84835}.member{display:grid;grid-template-columns:1fr 150px auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #e3eaee}.note{margin:12px 0;color:#627987;font-size:13px;line-height:1.55}.error{color:#b42318}@media(max-width:650px){.grid,.member{grid-template-columns:1fr}.secondary,.danger{width:100%}}</style></head><body><header><h1>จัดการสมาชิกหน่วยงาน</h1><div id="orgName">กำลังตรวจสอบสิทธิ์...</div></header><main><button class="secondary" id="backButton">← กลับพื้นที่ทำงาน</button><h2>เพิ่มหรือเปลี่ยนสิทธิ์สมาชิก</h2><p class="note">บัญชีอีเมลต้องถูกสร้างใน Supabase Authentication ก่อน หน้านี้ใช้สำหรับนำบัญชีที่มีอยู่เข้าหน่วยงานและกำหนดบทบาท</p><form id="memberForm" class="grid"><label>อีเมล<input id="memberEmail" type="email" required></label><label>บทบาท<select id="memberRole"><option value="viewer">ผู้ดูข้อมูล</option><option value="editor">ผู้แก้ไข</option><option value="admin">ผู้ดูแลหน่วยงาน</option></select></label><button type="submit">บันทึกสิทธิ์</button></form><div id="message" class="note" role="status"></div><h2>สมาชิกปัจจุบัน</h2><div id="members">กำลังโหลด...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const orgId=new URLSearchParams(location.search).get('org');const config=window.POLLUTION_MAP_CONFIG||{};let client=null;let currentUserId='';const message=document.getElementById('message');function roleName(role){return({admin:'ผู้ดูแลหน่วยงาน',editor:'ผู้แก้ไข',viewer:'ผู้ดูข้อมูล'})[role]||role;}function show(text,error=false){message.textContent=text;message.className='note '+(error?'error':'');}function escapeHtml(value){const div=document.createElement('div');div.textContent=String(value??'');return div.innerHTML;}async function loadMembers(){const {data,error}=await client.rpc('list_organization_members',{p_organization_id:orgId});if(error){show('ไม่มีสิทธิ์จัดการสมาชิกหรือโหลดรายชื่อไม่สำเร็จ',true);document.getElementById('members').textContent='';return;}document.getElementById('members').innerHTML=data.map(item=>`<div class="member"><div><strong>${escapeHtml(item.email)}</strong></div><div>${roleName(item.role)}</div>${item.user_id===currentUserId?'<small>บัญชีของคุณ</small>':`<button class="danger" type="button" onclick="removeMember('${item.user_id}')">ถอดสิทธิ์</button>`}</div>`).join('')||'ยังไม่มีสมาชิก';}async function removeMember(userId){if(!confirm('ถอดสิทธิ์สมาชิกคนนี้ออกจากหน่วยงานหรือไม่?'))return;const {error}=await client.rpc('remove_organization_member',{p_organization_id:orgId,p_user_id:userId});show(error?'ถอดสิทธิ์ไม่สำเร็จ':'ถอดสิทธิ์แล้ว',!!error);if(!error)await loadMembers();}async function boot(){if(!orgId||!config.supabaseUrl||!config.supabasePublishableKey){location.replace('login.html');return;}client=supabase.createClient(config.supabaseUrl,config.supabasePublishableKey);const {data}=await client.auth.getSession();if(!data.session){location.replace('login.html');return;}currentUserId=data.session.user.id;const {data:membership}=await client.from('organization_members').select('role,organizations(name)').eq('organization_id',orgId).maybeSingle();if(!membership||membership.role!=='admin'){location.replace('login.html');return;}document.getElementById('orgName').textContent=membership.organizations.name;await loadMembers();}document.getElementById('backButton').onclick=()=>location.href=`index.html?secure=1&org=${encodeURIComponent(orgId)}`;document.getElementById('memberForm').addEventListener('submit',async event=>{event.preventDefault();show('กำลังบันทึก...');const {error}=await client.rpc('add_organization_member_by_email',{p_organization_id:orgId,p_email:document.getElementById('memberEmail').value.trim(),p_role:document.getElementById('memberRole').value});show(error?(error.message.includes('user not found')?'ไม่พบบัญชีอีเมลนี้ในระบบ':'บันทึกสิทธิ์ไม่สำเร็จ'):'บันทึกสิทธิ์สมาชิกแล้ว',!!error);if(!error){event.target.reset();await loadMembers();}});boot().catch(()=>show('เชื่อมต่อระบบไม่สำเร็จ',true));
</script></body></html>
