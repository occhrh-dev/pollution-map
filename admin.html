<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>จัดการสมาชิกหน่วยงาน</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eef4f6;color:#173347;font-family:Sarabun,sans-serif}header{padding:20px 26px;color:#fff;background:#173347}main{width:min(860px,calc(100% - 28px));margin:24px auto;padding:24px;border-radius:15px;background:#fff;box-shadow:0 10px 30px rgba(22,50,74,.12)}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:1.3fr 1fr 180px auto;gap:8px;align-items:end}label{display:block;font-size:13px;font-weight:600}input,select,button{width:100%;margin-top:5px;padding:9px;border:1px solid #afc1ca;border-radius:8px;font:inherit}button{border:0;color:#fff;background:#0e7c7b;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.secondary{width:auto;color:#173347;background:#fff;border:1px solid #afc1ca}.danger{width:auto;background:#d84835}.member{display:grid;grid-template-columns:1.4fr 150px 110px auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #e3eaee}.member small{display:block;color:#627987}.status{font-weight:700;color:#08745e}.status.disabled{color:#9b3b31}.note{margin:12px 0;color:#627987;font-size:13px;line-height:1.55}.error{color:#b42318}.ok{color:#08745e}@media(max-width:700px){.grid,.member{grid-template-columns:1fr}.secondary,.danger{width:100%}}
  </style>
</head>
<body>
  <header><h1>จัดการสมาชิกหน่วยงาน</h1><div id="orgName">กำลังตรวจสอบสิทธิ์...</div></header>
  <main>
    <button class="secondary" id="backButton" type="button">← กลับพื้นที่ทำงาน</button>
    <h2>เพิ่มหรือเปลี่ยนสิทธิ์สมาชิก</h2>
    <p class="note">ใส่อีเมล Google ของผู้ใช้งานได้ทันที ไม่ต้องสร้างรหัสผ่านในระบบ เมื่อผู้ใช้เข้าสู่ระบบครั้งแรก ระบบจะผูกบัญชีกับทะเบียนนี้อัตโนมัติ</p>
    <form id="memberForm" class="grid">
      <label>อีเมล Google<input id="memberEmail" type="email" required></label>
      <label>ชื่อที่แสดง<input id="memberName" required></label>
      <label>บทบาท<select id="memberRole"><option value="VIEWER">ผู้ดูข้อมูล</option><option value="EDITOR">ผู้แก้ไข</option><option value="ADMIN">ผู้ดูแลหน่วยงาน</option></select></label>
      <button id="saveButton" type="submit">บันทึกสิทธิ์</button>
    </form>
    <div id="message" class="note" role="status"></div>
    <h2>สมาชิกปัจจุบัน</h2><div id="members">กำลังโหลด...</div>
  </main>
  <script src="config.js"></script><script src="auth-client.js"></script>
  <script>
    const orgId=new URLSearchParams(location.search).get('org');
    const auth=window.PollutionMapAuth; const message=document.getElementById('message'); let currentEmail='';
    function roleName(role){return({ADMIN:'ผู้ดูแลหน่วยงาน',EDITOR:'ผู้แก้ไข',VIEWER:'ผู้ดูข้อมูล'})[String(role).toUpperCase()]||role;}
    function show(text,error=false){message.textContent=text;message.className='note '+(error?'error':'ok');}
    function escapeHtml(value){const div=document.createElement('div');div.textContent=String(value??'');return div.innerHTML;}
    async function loadMembers(){
      try{
        const data=await auth.api('listMembers',{agencyId:orgId});
        document.getElementById('members').innerHTML=data.map(item=>`<div class="member"><div><strong>${escapeHtml(item.displayName||item.email)}</strong><small>${escapeHtml(item.email)}</small></div><div>${roleName(item.role)}</div><div class="status ${item.status==='ACTIVE'?'':'disabled'}">${item.status==='ACTIVE'?'ใช้งาน':'ระงับ'}</div>${item.email===currentEmail?'<small>บัญชีของคุณ</small>':item.status==='ACTIVE'?`<button class="danger" type="button" data-email="${encodeURIComponent(item.email)}">ระงับสิทธิ์</button>`:'<small>—</small>'}</div>`).join('')||'ยังไม่มีสมาชิก';
        document.querySelectorAll('[data-email]').forEach(button=>button.addEventListener('click',()=>disableMember(decodeURIComponent(button.dataset.email))));
      }catch(error){show(error.message||'โหลดรายชื่อสมาชิกไม่สำเร็จ',true);document.getElementById('members').textContent='';}
    }
    async function disableMember(email){
      if(!confirm(`ระงับสิทธิ์ ${email} หรือไม่?`))return;
      try{await auth.api('disableMember',{agencyId:orgId,email});show('ระงับสิทธิ์แล้ว');await loadMembers();}
      catch(error){show(error.message||'ระงับสิทธิ์ไม่สำเร็จ',true);}
    }
    async function boot(){
      if(!orgId||!auth.configured()||!auth.credential()){location.replace('login.html');return;}
      try{
        const data=await auth.api('session',{agencyId:orgId});
        if(String(data.membership.role).toUpperCase()!=='ADMIN')throw new Error('บัญชีนี้ไม่มีสิทธิ์จัดการสมาชิก');
        currentEmail=data.user.email; document.getElementById('orgName').textContent=data.agency.name; await loadMembers();
      }catch(error){show(error.message||'ตรวจสอบสิทธิ์ไม่สำเร็จ',true);setTimeout(()=>location.replace('login.html'),1600);}
    }
    document.getElementById('backButton').onclick=()=>location.href=`index.html?secure=1&org=${encodeURIComponent(orgId||'')}`;
    document.getElementById('memberForm').addEventListener('submit',async event=>{
      event.preventDefault(); const button=document.getElementById('saveButton'); button.disabled=true; show('กำลังบันทึก...');
      try{
        await auth.api('upsertMember',{agencyId:orgId,member:{email:document.getElementById('memberEmail').value.trim(),displayName:document.getElementById('memberName').value.trim(),role:document.getElementById('memberRole').value}});
        show('บันทึกสิทธิ์สมาชิกแล้ว'); event.target.reset(); await loadMembers();
      }catch(error){show(error.message||'บันทึกสิทธิ์ไม่สำเร็จ',true);}finally{button.disabled=false;}
    });
    boot();
  </script>
</body>
</html>
