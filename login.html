<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>เข้าสู่ระบบ — แผนที่ควบคุมมลพิษ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(145deg,#e8f4f3,#eef2f7);color:#173347;font-family:Sarabun,sans-serif}.shell{width:min(940px,100%);display:grid;grid-template-columns:minmax(260px,.9fr) minmax(300px,1.1fr);overflow:hidden;border-radius:20px;background:#fff;box-shadow:0 20px 55px rgba(22,50,74,.18)}.brand{padding:42px 36px;color:white;background:#173347}.brand h1{margin:0 0 14px;font-size:28px}.brand p{line-height:1.7;opacity:.88}.panel{padding:38px 36px}h2{margin:0 0 18px}.field{display:block;margin:13px 0 5px;font-weight:600}.input{width:100%;padding:11px 12px;border:1px solid #adc0ca;border-radius:9px;font:inherit}.button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:9px;color:white;background:#0e7c7b;font:inherit;font-weight:700;cursor:pointer}.button.secondary{width:auto;margin:8px 6px 0 0;padding:9px 12px;color:#173347;background:#edf4f5}.button:disabled{opacity:.55;cursor:not-allowed}.message{min-height:24px;margin-top:12px;font-size:14px}.error{color:#b42318}.ok{color:#08745e}.orgs{display:grid;gap:10px;margin-top:14px}.org{padding:13px;border:1px solid #d6e0e5;border-radius:11px}.org strong{display:block}.org small{color:#627987}.setup{padding:12px;border-left:4px solid #d88b00;background:#fff4d6;line-height:1.55;font-size:14px}.hidden{display:none!important}@media(max-width:700px){.shell{grid-template-columns:1fr}.brand{padding:26px}.panel{padding:27px}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="brand"><h1>🗺️ แผนที่ควบคุมมลพิษ</h1><p>ระบบบริหารข้อมูลแผนที่แยกตามหน่วยงาน ข้อมูลของแต่ละหน่วยงานได้รับการควบคุมด้วยบัญชีผู้ใช้และสิทธิ์จากฐานข้อมูล</p></section>
    <section class="panel">
      <div id="setup" class="setup hidden"><strong>ระบบเข้าสู่ระบบยังไม่ถูกเชื่อมต่อ</strong><br>ผู้ดูแลระบบต้องใส่ Supabase URL และ Publishable key ในไฟล์ config.js ก่อนเปิดใช้งานจริง</div>
      <form id="loginForm">
        <h2>เข้าสู่ระบบ</h2>
        <label class="field" for="email">อีเมล</label><input class="input" id="email" type="email" autocomplete="username" required>
        <label class="field" for="password">รหัสผ่าน</label><input class="input" id="password" type="password" autocomplete="current-password" required>
        <button class="button" id="loginButton" type="submit">เข้าสู่ระบบ</button>
        <button class="button secondary" id="resetButton" type="button">ลืมรหัสผ่าน</button>
      </form>
      <section id="workspacePanel" class="hidden"><h2>เลือกพื้นที่ทำงาน</h2><div id="accountText"></div><div class="orgs" id="organizations"></div><button class="button secondary" id="logoutButton" type="button">ออกจากระบบ</button></section>
      <div class="message" id="message" role="status"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const config = window.POLLUTION_MAP_CONFIG || {};
    const configured = /^https:\/\/.+\.supabase\.co$/i.test(config.supabaseUrl || '') && !!config.supabasePublishableKey;
    const loginForm = document.getElementById('loginForm');
    const workspacePanel = document.getElementById('workspacePanel');
    const message = document.getElementById('message');
    let client = null;
    function setMessage(text, error=false){message.textContent=text;message.className='message '+(error?'error':'ok');}
    async function showOrganizations(session){
      const {data,error}=await client.from('organization_members').select('organization_id,role,organizations(id,name,slug)').eq('user_id',session.user.id);
      if(error) throw error;
      loginForm.classList.add('hidden'); workspacePanel.classList.remove('hidden');
      document.getElementById('accountText').textContent=`เข้าสู่ระบบด้วย ${session.user.email}`;
      const list=document.getElementById('organizations');
      list.innerHTML=(data||[]).map(item=>{const org=item.organizations||{};return `<div class="org"><strong>${escapeHtml(org.name||'ไม่ทราบชื่อหน่วยงาน')}</strong><small>สิทธิ์: ${roleName(item.role)}</small><br><button class="button secondary" type="button" onclick="openWorkspace('${encodeURIComponent(item.organization_id)}')">เปิดพื้นที่ทำงาน</button></div>`}).join('')||'<div class="setup">บัญชีนี้ยังไม่ได้รับสิทธิ์ในหน่วยงาน กรุณาติดต่อผู้ดูแลระบบ</div>';
    }
    function escapeHtml(value){const div=document.createElement('div');div.textContent=String(value??'');return div.innerHTML;}
    function roleName(role){return ({admin:'ผู้ดูแลหน่วยงาน',editor:'ผู้แก้ไข',viewer:'ผู้ดูข้อมูล'})[role]||role;}
    function openWorkspace(id){location.href=`index.html?secure=1&org=${id}`;}
    async function boot(){
      if(!configured){document.getElementById('setup').classList.remove('hidden');loginForm.querySelectorAll('input,button').forEach(el=>el.disabled=true);return;}
      client=supabase.createClient(config.supabaseUrl,config.supabasePublishableKey);
      const {data}=await client.auth.getSession(); if(data.session) await showOrganizations(data.session);
    }
    loginForm.addEventListener('submit',async event=>{event.preventDefault();setMessage('กำลังตรวจสอบบัญชี...');document.getElementById('loginButton').disabled=true;try{const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;await showOrganizations(data.session);setMessage('เข้าสู่ระบบสำเร็จ');}catch(error){setMessage('เข้าสู่ระบบไม่สำเร็จ กรุณาตรวจสอบอีเมลและรหัสผ่าน',true);}finally{document.getElementById('loginButton').disabled=false;}});
    document.getElementById('logoutButton').addEventListener('click',async()=>{await client.auth.signOut({scope:'local'});location.reload();});
    document.getElementById('resetButton').addEventListener('click',async()=>{const email=document.getElementById('email').value.trim();if(!email){setMessage('กรุณากรอกอีเมลก่อนขอเปลี่ยนรหัสผ่าน',true);return;}setMessage('กำลังส่งลิงก์เปลี่ยนรหัสผ่าน...');const redirectTo=new URL('reset-password.html',location.href).href;const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo});setMessage(error?'ส่งลิงก์ไม่สำเร็จ กรุณาติดต่อผู้ดูแลระบบ':'ส่งลิงก์เปลี่ยนรหัสผ่านไปยังอีเมลแล้ว',!!error);});
    boot().catch(()=>setMessage('เชื่อมต่อระบบบัญชีไม่สำเร็จ',true));
  </script>
</body>
</html>
