name: RBAC regression tests
on:
  push:
    branches: [feature/system-admin-rbac]
  pull_request:
    paths:
      - 'apps-script/**'
      - 'login.html'
      - 'admin.html'
      - 'system-admin.html'
      - 'registration.html'
      - 'scripts/test-rbac.js'
      - 'scripts/test-backup-alerts.js'
      - 'scripts/test-change-aware-backup.js'
      - '.github/workflows/rbac-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rbac:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-rbac.js
      - run: node scripts/test-backup-alerts.js
      - run: node scripts/test-change-aware-backup.js
