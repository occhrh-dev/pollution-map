name: Pollution Map checks
on:
  push:
    branches: [main, feature/system-admin-rbac]
  pull_request:
    paths:
      - '*.html'
      - '*.js'
      - 'scripts/**'
      - 'apps-script/**'
      - '.github/workflows/rbac-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rbac:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-syntax.mjs
      - run: node scripts/test-auth-client.js
      - run: node scripts/test-rbac.js
      - run: node scripts/test-backup-alerts.js
      - run: node scripts/test-change-aware-backup.js
