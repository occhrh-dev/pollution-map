name: Apply system owner and audit changes once
on:
  push:
    branches: [feature/system-owner-audit]
    paths:
      - scripts/apply-system-owner-audit.js
      - .github/workflows/system-owner-audit-once.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded migration
        run: node scripts/apply-system-owner-audit.js
      - name: Run RBAC regression suite
        run: node scripts/test-rbac.js
      - name: Verify diff
        run: git diff --check
      - name: Commit verified changes
        run: |
          git add apps-script/Code.gs scripts/test-rbac.js
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add system owner role and audit log API'
          git push origin HEAD:refs/heads/feature/system-owner-audit
